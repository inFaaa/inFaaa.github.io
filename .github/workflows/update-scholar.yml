name: Update Google Scholar citations

on:
  schedule:
    - cron: '23 8 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-scholar
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'inFaaa/inFaaa.github.io' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Read the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test the citation parser
        run: python3 -m unittest discover -s tests -p 'test_update_scholar.py'
      - name: Read the public Google Scholar profile
        run: python3 scripts/update_scholar.py
      - name: Save the successful result
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- data/scholar-stats.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Google Scholar citation count'
          git push origin "HEAD:$DEFAULT_BRANCH"
